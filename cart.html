<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your Mousa Store cart — review items and check out via Instagram DM.">
  <title>Your Cart — Mousa Store</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="nav container" aria-label="Main navigation">
      <a class="brand" href="index.html">Mousa<span>Store</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Shop</a></li>
        <li><a class="cart-link active" href="cart.html" aria-current="page">Cart <span class="cart-count" id="cartCount" hidden>0</span></a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1 class="page-title">Your Cart</h1>
    <p class="page-subtitle">Review your items below, then check out via Instagram DM.</p>

    <div class="cart-layout">
      <div id="cartItems" class="cart-items">
        <div class="state-box">
          <div class="spinner"></div>
          <p>Loading your cart…</p>
        </div>
      </div>

      <aside class="cart-summary" id="cartSummary">
        <h2>Order Summary</h2>
        <div class="summary-row">
          <span>Subtotal</span>
          <strong id="subtotal">0.00 EGP</strong>
        </div>
        <p class="summary-hint">Delivery cost and details are confirmed in the Instagram chat.</p>
        <button class="btn btn-instagram" id="checkoutBtn" disabled>
          Checkout via Instagram
        </button>
        <button class="btn btn-secondary btn-block" id="clearCartBtn" disabled>Clear cart</button>
        <a href="index.html" class="summary-hint">← Continue shopping</a>
      </aside>
    </div>
  </main>

  <footer class="site-footer container">
    <span>© <span id="year"></span> Mousa Store</span>
    <a href="admin/login.html">Admin</a>
  </footer>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
