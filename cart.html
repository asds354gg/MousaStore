<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="سلة مشترياتك في متجر موسى — راجع منتجاتك وأتمم الطلب عبر رسائل إنستغرام المباشرة.">
  <title>سلتك — متجر موسى</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="التنقل الرئيسي">
      <a class="brand" href="index.html">Mousa<span>Store</span></a>
      <ul class="nav-links">
        <li><a href="index.html">المتجر</a></li>
        <li><a class="cart-link active" href="cart.html" aria-current="page">السلة <span class="cart-count" id="cartCount" hidden>0</span></a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1 class="page-title">سلتك</h1>
    <p class="page-subtitle">راجع منتجاتك بالأسفل، ثم أتمم طلبك عبر رسائل إنستغرام المباشرة.</p>

    <div class="cart-layout">
      <div id="cartItems" class="cart-items">
        <div class="state-box">
          <div class="spinner"></div>
          <p>جارٍ تحميل سلتك…</p>
        </div>
      </div>

      <aside class="cart-summary" id="cartSummary">
        <h2>ملخص الطلب</h2>
        <div class="summary-row">
          <span>الإجمالي الفرعي</span>
          <strong id="subtotal">0.00 EGP</strong>
        </div>
        <p class="summary-hint">يتم تأكيد تكلفة التوصيل والتفاصيل في محادثة إنستغرام.</p>
        <button class="btn btn-instagram" id="checkoutBtn" disabled>
          إتمام الطلب عبر إنستغرام
        </button>
        <button class="btn btn-secondary btn-block" id="clearCartBtn" disabled>تفريغ السلة</button>
        <a href="index.html" class="summary-hint">→ مواصلة التسوق</a>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <span>© <span id="year"></span> متجر موسى</span>
  </footer>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
